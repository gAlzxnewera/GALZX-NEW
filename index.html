</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4">

            <!-- Instagram Button -->
            <a href="https://www.instagram.com/galzxnew" target="_blank" rel="noopener noreferrer" class="glass-button flex items-center justify-between p-4 rounded-2xl w-full group">

            <!-- Telegram Main Button -->

            <!-- Telegram Sub-menu -->

                <a href="https://t.me/GALZX666NEW" target="_blank" rel="noopener noreferrer" class="glass-button flex items-center justify-between p-3 rounded-xl w-full group">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-lg bg-sky-500/20 flex items-center justify-center text-sky-400">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </div>
                        <span class="text-xs font-semibold text-white">@GALZX666NEW</span>
                    </div>
                    <i class="fa-solid fa-arrow-right text-[10px] text-slate-400 group-hover:text-white"></i>
                </a>

                <a href="https://t.me/GALZXCUH" target="_blank" rel="noopener noreferrer" class="glass-button flex items-center justify-between p-3 rounded-xl w-full group">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-lg bg-sky-500/20 flex items-center justify-center text-sky-400">
                            <i class="fa-solid fa-paper-plane text-xs"></i>

            <!-- QRIS Button -->

                    </div>
                    <div class="text-left">

            <!-- Tombol Live Chat Admin -->

    <!-- QRIS Modal -->
    <div id="qris-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">

                <button onclick="closeQrisModal()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white">

                </button>
            </div>
            <div class="bg-white p-3 rounded-2xl mb-3 inline-block">
                <img src="https://files.catbox.moe/3unjk8.jpg" alt="QRIS" class="w-56 h-auto mx-auto rounded-lg object-contain">
            </div>
            <button onclick="downloadQris()" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-xs flex items-center justify-center gap-2 mb-4">
                <i class="fa-solid fa-download"></i> Download Foto QRIS
            </button>
            <div class="bg-slate-800/80 border border-slate-700/50 rounded-2xl p-3.5 mb-4 text-left">
                <div class="text-xs text-slate-400 mb-1 flex justify-between">
                    <span>No. DANA:</span>
                    <button onclick="copyDana()" class="text-cyan-400 text-[11px] font-semibold"><i class="fa-regular fa-copy"></i> Salin</button>
                </div>
                <div class="text-base font-bold text-white tracking-wide">0838-4312-3569</div>
            </div>
        </div>
    </div>

    <!-- Chat Admin Modal -->
    <div id="chat-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-panel rounded-3xl p-5 max-w-sm w-full flex flex-col h-[400px] relative">
            <div class="flex justify-between items-center pb-3 border-b border-slate-700/50">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-circle text-emerald-400 text-[8px]"></i> Chat Admin GALZ
                </h3>
                <button onclick="closeChatModal()" class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
            
            <div id="chat-messages" class="flex-1 overflow-y-auto py-3 space-y-2 text-xs">
                <div class="bg-slate-800/80 p-2.5 rounded-xl text-slate-300 max-w-[85%]">
                    Halo! Ada yang bisa dibantu? Silakan ketik pesan kamu di bawah, nanti akan langsung masuk ke Telegram Admin.
                </div>
            </div>

            <div class="pt-3 border-t border-slate-700/50 flex gap-2">
                <input type="text" id="chat-input" placeholder="Tulis pesan..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
                <button onclick="sendChatMessage()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3.5 py-2 rounded-xl text-xs font-semibold">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleTelegramMenu() {
            document.getElementById('telegram-submenu').classList.toggle('hidden');
            document.getElementById('tg-arrow').classList.toggle('rotate-180');
        }

        function openQrisModal() { document.getElementById('qris-modal').classList.remove('hidden'); document.getElementById('qris-modal').classList.add('flex'); }
        function closeQrisModal() { document.getElementById('qris-modal').classList.remove('flex'); document.getElementById('qris-modal').classList.add('hidden'); }
        function openChatModal() { document.getElementById('chat-modal').classList.remove('hidden'); document.getElementById('chat-modal').classList.add('flex'); }
        function closeChatModal() { document.getElementById('chat-modal').classList.remove('flex'); document.getElementById('chat-modal').classList.add('hidden'); }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const messagesContainer = document.getElementById('chat-messages');
            const text = input.value.trim();
            if (!text) return;

            let sessionId = localStorage.getItem('galz_session');
            if (!sessionId) {
                sessionId = 'USER-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                localStorage.setItem('galz_session', sessionId);
            }

            const userBubble = document.createElement('div');
            userBubble.className = 'bg-cyan-600/80 text-white p-2.5 rounded-xl max-w-[85%] ml-auto text-right mb-2';
            userBubble.textContent = text;
            messagesContainer.appendChild(userBubble);
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                // Mengarah langsung ke panel server kamu dengan port 25568
                const response = await fetch('https://danmauewe.r-cloud.my.id:25568/api/send-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, sessionId: sessionId })
                });

                const data = await response.json();
                const adminBubble = document.createElement('div');
                adminBubble.className = 'bg-slate-800/80 p-2.5 rounded-xl text-slate-300 max-w-[85%] mb-2';
                adminBubble.textContent = data.success ? "Pesan terkirim ke Telegram Admin!" : "Gagal mengirim pesan.";
                messagesContainer.appendChild(adminBubble);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (err) {
                const errorBubble = document.createElement('div');
                errorBubble.className = 'bg-red-950/80 border border-red-500/30 p-2.5 rounded-xl text-red-200 max-w-[85%] mb-2';
                errorBubble.textContent = "Koneksi ke server gagal. Pastikan server panel di port 25568 sedang menyala.";
                messagesContainer.appendChild(errorBubble);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        function downloadQris() { window.open("https://files.catbox.moe/3unjk8.jpg", '_blank'); }
        function copyDana() { navigator.clipboard.writeText("083843123569").then(() => alert("Nomor DANA disalin!")); }
    </script>
